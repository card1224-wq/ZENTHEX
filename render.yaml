services:
  - type: web
    name: zenthex-saas
    env: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ZENTHEX_OWNER_EMAILS
        value: 7foliath@naver.com
      - key: ZENTHEX_SERVER_PUBLIC_IP
        value: 74.220.52.254
      - key: ZENTHEX_ENABLE_DEV_OUTBOX
        value: "false"
      - key: ZENTHEX_ENABLE_MOCK_PAYMENT
        value: "false"
